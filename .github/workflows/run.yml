name: XAU/USD Predator Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install System Fonts (Wajib agar Chart Muncul)
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation fontconfig

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_BALANCE: ${{ secrets.ACCOUNT_BALANCE || '10000.0' }}
          RISK_PERCENT: ${{ secrets.RISK_PERCENT || '1.0' }}
          SYMBOL: ${{ secrets.SYMBOL || 'GC=F' }}
        run: python bot.py
