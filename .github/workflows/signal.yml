name: XAUUSD Signal Bot

on:
  schedule:
    - cron: '1,31 * * * *'   # Backup trigger (menit :01 & :31)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xauusd-signal-${{ github.ref }}
  cancel-in-progress: false

timeout-minutes: 10

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
