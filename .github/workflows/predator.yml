name: XAUUSD Predator SMC Scanner

on:
  schedule:
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  scan_market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Restore/Save State Cache
        uses: actions/cache@v4
        with:
          path: predator_state.json
          key: predator-state-${{ github.run_id }}
          restore-keys: |
            predator-state-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Predator SMC Engine
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python predator.py
